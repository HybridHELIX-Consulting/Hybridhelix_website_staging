name: Publish safety

# Two gates, one workflow.
#
# crawl-protection - pages must declare crawl intent matching CRAWL_MODE.
# disclosure-scan - the site must not ship sensitive content.
#
# CRAWL_MODE controls the assertion direction:
#   staging    -> noindex must be present (default)
#   production -> noindex must be absent
# The flip is a single env-var change at root-domain cutover.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRAWL_MODE: staging

jobs:
  crawl-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every published page must declare crawl intent matching CRAWL_MODE
        run: |
          fail=0

          check_html_file() {
            local f="$1"
            # Extract front matter block if present.
            fm=$(awk 'NR==1 && /^---[[:space:]]*$/ {inb=1; next} inb && /^---[[:space:]]*$/ {exit} inb' "$f")

            if [ -n "$fm" ]; then
              if printf '%s\n' "$fm" | grep -Eq '^layout:[[:space:]]*[^[:space:]#]'; then
                return 0
              fi
              echo "::error file=$f::Front matter is present but declares no layout. Add a layout: key. See AUTHORING.md Rule 1."
              return 1
            fi

            # No front matter: check for robots meta tag.
            if [ "$CRAWL_MODE" = "staging" ]; then
              if grep -Eqi '<meta[^>]*name=["'"'"']?robots["'"'"']?[^>]*noindex' "$f"; then
                return 0
              fi
              echo "::error file=$f::No layout and no noindex robots meta tag (CRAWL_MODE=staging requires noindex). See AUTHORING.md Rule 1."
              return 1
            elif [ "$CRAWL_MODE" = "production" ]; then
              if grep -Eqi '<meta[^>]*name=["'"'"']?robots["'"'"']?[^>]*noindex' "$f"; then
                echo "::error file=$f::Page carries noindex but CRAWL_MODE=production. Remove the noindex directive for production pages."
                return 1
              fi
              return 0
            fi
          }

          # Check all HTML files (excluding build output, vendor, layouts, includes).
          while IFS= read -r f; do
            if ! check_html_file "$f"; then
              fail=1
            fi
          done < <(find . -path ./_site -prune -o -path ./vendor -prune -o -name '*.html' -not -path './_layouts/*' -not -path './_includes/*' -print)

          # Check markdown files: must have front matter with a layout key.
          # Exempt _legal/ and _posts/ (layout applied via _config.yml collection defaults).
          # Exempt .github/ (repository meta-files, not Jekyll pages).
          while IFS= read -r f; do
            fm=$(awk 'NR==1 && /^---[[:space:]]*$/ {inb=1; next} inb && /^---[[:space:]]*$/ {exit} inb' "$f")

            if [ -z "$fm" ]; then
              echo "::error file=$f::Markdown page has no front matter. Add front matter with a layout: key. See AUTHORING.md Rule 1."
              fail=1
              continue
            fi

            if ! printf '%s\n' "$fm" | grep -Eq '^layout:[[:space:]]*[^[:space:]#]'; then
              echo "::error file=$f::Front matter is present but declares no layout. Add a layout: key."
              fail=1
            fi
          done < <(find . -path ./_site -prune -o -path ./vendor -prune -o -path ./_legal -prune -o -path ./.github -prune -o -path ./_posts -prune -o \( -name '*.md' -o -name '*.markdown' \) -not -name 'README.md' -not -name 'AUTHORING.md' -not -name 'CHANGELOG.md' -not -path './_layouts/*' -not -path './_includes/*' -print)

          if [ "$fail" -eq 0 ]; then
            echo "All published pages pass crawl-protection check (CRAWL_MODE=$CRAWL_MODE)."
          fi
          exit $fail

      - name: Posts must carry front matter and resolve to exactly one lane
        run: |
          fail=0
          if [ -d _posts ]; then
            for f in _posts/*.md _posts/*.markdown; do
              [ -e "$f" ] || continue

              fm=$(awk 'NR==1 && /^---[[:space:]]*$/ {inb=1; next} inb && /^---[[:space:]]*$/ {exit} inb' "$f")
              if [ -z "$fm" ]; then
                echo "::error file=$f::Post is missing front matter."
                fail=1
                continue
              fi

              cats=$(printf '%s\n' "$fm" \
                | sed -n 's/^categories:[[:space:]]*//p' \
                | tr -d '[]"'"'"',' )

              if [ -z "$cats" ]; then
                echo "::error file=$f::Post declares no categories, so it silently defaults to the blog lane. State it explicitly: categories: [blog] or categories: [reports]. See AUTHORING.md Rule 3."
                fail=1
                continue
              fi

              count=0
              for c in $cats; do
                case "$c" in
                  blog|reports)
                    count=$((count + 1))
                    ;;
                  *)
                    echo "::error file=$f::Unknown category '$c'. The only lanes are blog and reports. Use tags for any secondary classification."
                    fail=1
                    ;;
                esac
              done

              if [ "$count" -ne 1 ]; then
                echo "::error file=$f::Post must resolve to exactly one lane, found $count. blog and reports are mutually exclusive because the URL and the label both derive from the first category."
                fail=1
              fi
            done
          fi

          if [ "$fail" -eq 0 ]; then
            echo "All posts carry front matter and resolve to exactly one lane."
          fi
          exit $fail

  disclosure-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nothing sensitive reaches public output
        run: |
          chmod +x .github/scripts/disclosure-scan.sh
          .github/scripts/disclosure-scan.sh
