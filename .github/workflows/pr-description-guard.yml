name: PR description guard

# Enforces the PR security policy: all internal documentation lives in ClickUp,
# not on public GitHub. PRs must contain a ClickUp URL and nothing more than a
# short title. This prevents internal thinking, rationale, and file-level notes
# from leaking to the public repository.
#
# Added 8/9/2026 per PR security policy discussion.
#
# NOTE: This job must be added to the branch protection required-checks list on
# main to become a blocking gate.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-template-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: PR must link to ClickUp and contain no internal context
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0

          # Gate 1: ClickUp URL must be present
          if ! echo "$PR_BODY" | grep -Eq 'https://app\.clickup\.com/'; then
            echo "::error::PR description must contain a ClickUp document URL. All change documentation lives in the project notebook, not on GitHub. See .github/PULL_REQUEST_TEMPLATE.md."
            fail=1
          fi

          # Gate 2: strip HTML comments (the template instructions) and check length
          stripped=$(echo "$PR_BODY" | sed '/<!--/,/-->/d' | tr -s '[:space:]' ' ' | xargs)
          char_count=${#stripped}

          if [ "$char_count" -gt 300 ]; then
            echo "::error::PR description is $char_count characters (limit: 300). Keep it to the ClickUp link and a short title. Internal context belongs in the ClickUp change page, not the public GitHub PR."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "PR description is compliant: contains ClickUp link, no excess content."
          fi
          exit $fail
