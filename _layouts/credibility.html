---
layout: default
---
<section class="shell hero">
  <p class="eyebrow eyebrow--lime">{{ page.eyebrow | default: 'Proof' }}</p>
  <h1>{{ page.title }}</h1>
  {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{%- endif %}
</section>

{%- if page.facts %}
<section class="shell">
  <div class="facts">
    {%- for fact in page.facts %}
    <div><span>{{ fact.label }}</span><span>{{ fact.value }}</span></div>
    {%- endfor %}
  </div>
</section>
{%- endif %}

<section class="shell prose">
  {{ content }}
</section>
