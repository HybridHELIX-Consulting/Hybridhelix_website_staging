title: HybridHELIX Consulting
description: Staging environment for HybridHELIX Consulting
baseurl: ""
url: "https://staging.hybridhelix.net"

# --- URL architecture (locked 8/8/2026, 30.6.5) -------------------------
# No dates in URLs. Category is the lane: /blog/<slug>/ or /reports/<slug>/.
# Changing this later creates redirects. Do not change it casually.
permalink: /:categories/:slug/

plugins:
  - jekyll-feed

# --- Collections (extended 8/9/2026, 30.11) ------------------------------
# Legal/policy documents get their own collection. Not in the feed, not in
# related-posts, not in the sitemap-for-posts. Adding a new policy page is
# a markdown file in _legal/ with the right front matter.
collections:
  legal:
    output: true
    permalink: /legal/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      categories: [blog]
  - scope:
      path: ""
      type: legal
    values:
      layout: legal
      index: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - AUTHORING.md
  - README.md

# Staging is noindex end to end. See _includes/custom-head.html.
